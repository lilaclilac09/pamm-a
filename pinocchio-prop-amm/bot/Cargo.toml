[package]
name = "pinocchio-oracle-bot"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "oracle-bot"
path = "src/main.rs"

[[bin]]
name = "sim"
path = "src/bin/sim.rs"

[[bin]]
name = "add_liq"
path = "src/bin/add_liq.rs"

[[bin]]
name = "reader_bot"
path = "src/bin/reader_bot.rs"

[[bin]]
name = "add_liq_v2"
path = "src/bin/add_liq_v2.rs"

[dependencies]
solana-sdk    = "1.18"
solana-client = "1.18"
tokio   = { version = "1", features = ["full"] }
dotenv  = "0.15"
bs58    = "0.5"
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
anyhow  = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
axum         = { version = "0.7", features = ["json"] }
tower-http   = { version = "0.5", features = ["cors"] }
tokio-stream = "0.1"
async-stream = "0.3"
base64  = "0.22"
bincode = "1"
