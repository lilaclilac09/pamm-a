[package]
name = "pinocchio-oracle-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oracle-bot"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-transaction-status = "1.18"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
