[package]
name = "pinocchio-prop-amm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-token = "0.5.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-keypair = "3.1"
solana-message = "3.0"
solana-transaction = "3.0"
solana-signer = "3.0"
solana-address = "2.0"
solana-pubkey = "2.4"
solana-instruction = "2.3"
solana-system-interface = "1.0"
