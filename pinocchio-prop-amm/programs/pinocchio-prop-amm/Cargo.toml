[package]
name = "pinocchio-prop-amm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

pinocchio = "0.10.2"
solana-program = "*"
pyth-sdk-solana = "*"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
litesvm = "0.10.0"

[dependencies]
pinocchio = { version = "0.10.2", features = ["cpi"] }
pinocchio-token = "0.5.0"
